name: Build Contribution Shooter GIF

on:
  schedule:
    # Runs every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Clone Contribution Shooter repo
        run: git clone https://github.com/NotDari/ContributionShooter project

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: project

      - name: Build GIF
        run: python main.py
        working-directory: project
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Copy GIF to profile repo
        run: |
          mkdir -p builds
          cp project/build/contribution-shooter.gif builds/contribution-shooter.gif

      - name: Commit and push GIF
        run: |
          git add builds/contribution-shooter.gif
          git diff-index --quiet HEAD || git commit -m "GIF DAILY UPDATE"
          git push
